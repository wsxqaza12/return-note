[package]
name = "return-note"
version = "0.7.1"
edition = "2024"
description = "A small, local-first sticky note for getting back to work"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus", "Win32_Graphics_Dwm", "Win32_Networking_WinHttp",
  "Win32_Security", "Win32_Security_Credentials", "Win32_Storage_FileSystem",
  "Win32_System_SystemServices", "Win32_System_LibraryLoader", "Win32_System_Threading",
  "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
